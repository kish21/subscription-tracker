# gitleaks configuration — secret scanning for this repo.
#
# Runs in two places: pre-commit (blocks the commit) and CI (blocks the merge).
# The allowlist below is deliberately tiny. Every entry is a DOCUMENTED dev fake.
# If a scan trips on something real, the fix is to remove the secret and rotate it —
# never to widen this allowlist.

title = "subscription-tracker gitleaks config"

[extend]
# Inherit gitleaks' full built-in ruleset (AWS keys, GitHub tokens, private keys,
# generic high-entropy strings, ...). We only add exceptions, never remove rules.
useDefault = true

[allowlist]
description = "Documented local-development fakes only"

paths = [
  # Committed on purpose: contains variable NAMES and local-only placeholders.
  '''^\.env\.example$''',
  # Local Postgres for `docker compose up` — credentials are localhost-only and
  # match .env.example by design.
  '''^docker-compose\.yml$''',
]

regexes = [
  # The placeholder shipped in .env.example. Real secrets are generated by the
  # developer with `openssl rand -base64 32` and live only in an untracked .env.
  '''replace-me-with-32-plus-random-characters-abcd''',
  # Local dev database password used by docker-compose + .env.example. Never used
  # anywhere a real user's data lives.
  '''tracker_local_dev''',
]
